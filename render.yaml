# Render Blueprint — free-tier API + PostgreSQL + Key Value (Redis-compatible).
# New → Blueprint → select this repository. Set CLIENT_URL to the planned Vercel
# origin during Blueprint creation; it is marked sync: false.
services:
  - type: web
    name: ludo-nova-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:server
    # Free instances do not support pre-deploy commands; apply migrations at startup.
    startCommand: npm run db:deploy && node apps/server/dist/index.js
    healthCheckPath: /health
    # Deploy only after GitHub checks (CI) pass on the commit.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-nova-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ludo-nova-kv
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: ludo-nova-kv
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: ludo-nova-db
    plan: free
    region: oregon
    databaseName: ludo
    user: ludo
    ipAllowList: []
