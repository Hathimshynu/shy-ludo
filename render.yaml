# Render Blueprint — API + PostgreSQL + Key Value (Redis-compatible).
# New → Blueprint → select this repository. After the first deploy set CLIENT_URL
# to your Vercel URL(s) in the dashboard (it is marked sync: false).
services:
  - type: web
    name: ludo-nova-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:server
    preDeployCommand: npm run db:deploy
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    # Deploy only after GitHub checks (CI) pass on the commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-nova-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ludo-nova-kv
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: ludo-nova-kv
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: ludo-nova-db
    plan: basic-256mb
    region: oregon
    databaseName: ludo
    user: ludo
    ipAllowList: []
